<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>大厅 · 理想型·加载中</title>
  <link rel="stylesheet" href="../theme-v2.css" />
  <link rel="stylesheet" href="./lobby.css" />
</head>
<body>

<!-- ==========================================================================
     大厅 R12「走过卡座」：整页 = 一间连续的店，从上往下走。
       门头 → 酒柜区 → 吧台区（雪克） → 卡座区（纵向桌卡列表） → 店规
     不是一屏塞死的桌位网格；列表语义天然不封顶。
     ========================================================================== -->
<div class="bar fx-vignette fx-noise" id="bar">

  <!-- ---------- 常驻工具条：黄铜挂牌，钉在门框上 ---------- -->
  <div class="doorbar">
    <button class="brasstag" id="findFriendsBtn" type="button">
      <span class="brasstag-ico" aria-hidden="true"></span><span>报房间码</span>
    </button>
    <button class="brasstag" id="homeEntry" type="button">
      <span class="brasstag-ico ico-book" aria-hidden="true"></span><span>我的柜子</span>
    </button>
  </div>

  <!-- ---------- 一、门头：吊灯 + 招牌（有支架有电线） ---------- -->
  <header class="zone zone-door">
    <div class="ceiling" aria-hidden="true">
      <span class="hang-lamp l1"><i></i></span>
      <span class="hang-lamp l2"><i></i></span>
      <span class="disco-wrap"><span class="disco-ball"><i class="disco-chain"></i></span></span>
    </div>
    <!-- 招牌：两根黄铜吊杆把牌子吊在天花板下，牌子背后一圈灯管 -->
    <div class="signboard">
      <span class="sign-rod rod-l" aria-hidden="true"></span>
      <span class="sign-rod rod-r" aria-hidden="true"></span>
      <div class="sign-plate">
        <img class="sign-logo neon-flicker" src="../assets-v2/logo.svg" alt="理想型·加载中" />
      </div>
    </div>
    <p class="door-rule">酒和灯只能把人送到 99%，差的那 1%，是个人。</p>
  </header>

  <!-- ---------- 未注册引导：门口那块立牌 ---------- -->
  <a class="guest-easel" id="guestBanner" href="/v2/cocktail.html" hidden>
    <span class="easel-body">
      <b>生面孔？</b>
      <span>先去吧台调杯酒，我好记住你。</span>
    </span>
    <span class="easel-go">去调酒 →</span>
    <span class="easel-legs" aria-hidden="true"></span>
  </a>

  <!-- ---------- 二、酒柜区：密集酒瓶群 + 像素小画 + 黑板 ---------- -->
  <section class="zone zone-backbar" aria-label="酒柜">
    <!-- 整面酒柜由 lobby.js 画成一张 SVG（瓶群/相框/黑板/壁灯全是实体） -->
    <div class="backbar-art" id="backbarArt"></div>
  </section>

  <!-- ---------- 三、吧台区：雪克站在吧台后 ---------- -->
  <section class="zone zone-bar" aria-label="吧台">
    <div class="bar-stage">
      <!-- 雪克（bartender.js 组件，scene:false = 直接站进这间店） -->
      <div class="xueke" id="bartenderStage">
        <div class="xueke-body" id="bartenderSlot" title="雪克"></div>
      </div>
      <!-- 雪克的话：实体小黑板挂牌，不是浮字 -->
      <div class="xueke-say" id="xuekeSay"><b>雪克</b><span id="xuekeLine">今晚想喝点什么故事？</span></div>

      <!-- 吧台：木台面 + 黄铜压条 + 台面小物 -->
      <div class="counter">
        <div class="counter-top" aria-hidden="true"></div>
        <div class="counter-props" aria-hidden="true">
          <i class="prop-glass"></i><i class="prop-glass g2"></i><i class="prop-bottle"></i>
          <i class="prop-phone"></i>
        </div>
        <div class="counter-face" aria-hidden="true"></div>
      </div>

      <!-- 吧台凳：两张空凳 + 一张留给一个人的 -->
      <div class="stool-row">
        <span class="stool deco" aria-hidden="true"><i></i></span>
        <button class="solo-seat" id="soloSeat" type="button"
                title="吧台这个位置本来就是留给一个人的，视野还最好。">
          <span class="stool solo" aria-hidden="true"><i></i></span>
          <span class="solo-label">一个人？坐吧台，和雪克喝</span>
        </button>
        <span class="stool deco" aria-hidden="true"><i></i></span>
      </div>
    </div>
  </section>

  <!-- ---------- 四、卡座区：纵向桌卡列表（点卡入桌） ---------- -->
  <section class="zone zone-booths" aria-label="卡座">
    <!-- 区隔牌：木牌 + 黄铜钉，钉在卡座区入口的隔断上 -->
    <div class="zone-sign">
      <span class="zone-sign-nail" aria-hidden="true"></span>
      <span class="zone-sign-text">卡 座</span>
      <span class="zone-sign-nail" aria-hidden="true"></span>
    </div>
    <p class="zone-note" id="boothNote">桌子都留着，人到就开。</p>

    <ul class="booths" id="boothList"><!-- lobby.js 生成 --></ul>
  </section>

  <!-- ---------- 五、后门：店规 ---------- -->
  <footer class="zone zone-foot">
    <div class="foot-plate">
      <span class="foot-nail" aria-hidden="true"></span>
      <span>本店只调到 99%</span>
      <span class="foot-nail" aria-hidden="true"></span>
    </div>
  </footer>
</div>

<!-- ---------- 找朋友：吧台电话本 ---------- -->
<div class="codeboard" id="codeboard" hidden>
  <div class="codeboard-panel" role="dialog" aria-label="报房间码">
    <button class="codeboard-close" id="codeClose" type="button" aria-label="关闭">×</button>
    <div class="codeboard-title px-title neon-pink">报房间码</div>
    <p class="codeboard-line">报个房间码，我带你过去。</p>
    <input class="code-input px-title" id="codeInput" inputmode="numeric" maxlength="4"
           placeholder="0000" autocomplete="off" />
    <div class="code-msg" id="codeMsg"></div>
    <button class="code-go px-title" id="codeGo" type="button">带我过去</button>
  </div>
</div>

<script type="module" src="./lobby.js"></script>
</body>
</html>
