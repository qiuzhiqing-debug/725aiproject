<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>理想型档案</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#1a1014" />
  <meta name="color-scheme" content="dark" />
  <link rel="stylesheet" href="/theme-v2.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* R10：档案页和游戏是同一家店的同一个夜晚 —— 同一张后吧台场景图 + 同一层暖雾 */
    body {
      position: relative;
      background-color: var(--bar-bg);
      color: var(--ink-hi);
      font-family: var(--font-sans);
      min-height: 100dvh;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image: var(--scene-backbar);
      background-repeat: no-repeat;
      background-position: 50% 0;
      background-size: cover;
      opacity: 0.9;
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 62% 32% at 26% 4%, var(--glow-amber-25), transparent 62%),
        radial-gradient(ellipse 128% 92% at 50% 44%, transparent 48%, rgba(8, 4, 5, 0.72) 100%);
    }
    body > * { position: relative; z-index: 1; }

    /* ---- 顶部导航 ---- */
    .nav {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 0;
      background-color: var(--bar-bg-deep);
      background-image: var(--tex-wood);
      box-shadow: 0 3px 0 var(--brass-shade), 0 8px 22px rgba(0, 0, 0, 0.55);
    }
    /* 小尺寸下用纯文字 logo：完整招牌 SVG 缩到 28px 时进度条会糊成一团 */
    .nav-logo-text {
      font-family: var(--font-pixel);
      font-size: 17px;
      letter-spacing: .06em;
      color: #ffd7e6;
      text-shadow: 0 0 1px #fff, 0 0 6px var(--neon-pink-hot);
      white-space: nowrap;
      text-decoration: none;
    }
    .nav-back {
      margin-left: auto;
      color: var(--amber-hi);
      text-decoration: none;
      font-size: 14px;
      font-family: var(--font-pixel);
      opacity: .85;
    }
    .nav-back:hover { opacity: 1; text-shadow: var(--neon-text-amber); }

    /* ---- 用户卡片 ---- */
    .user-card {
      margin: 20px 16px 0;
      padding: 20px;
      background: var(--panel);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-panel);
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }
    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--brass);
      box-shadow: 0 0 12px var(--glow-amber-55);
      flex-shrink: 0;
      background: var(--bar-bg-raise);
    }
    .avatar-placeholder {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 2px solid var(--brass);
      box-shadow: 0 0 12px var(--glow-amber-55);
      flex-shrink: 0;
      background: var(--bar-bg-raise);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    .user-info { flex: 1; min-width: 0; }
    .user-nick {
      font-family: var(--font-pixel);
      font-size: 20px;
      color: var(--ink-hi);
    }
    .user-cocktail {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .cocktail-glass-icon {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      filter: drop-shadow(0 0 6px var(--glow-amber-55));
    }
    .cocktail-glass-icon svg { width: 100%; height: 100%; display: block; }
    .user-cocktail-text {
      font-size: 13px;
      color: var(--neon-amber);
      font-style: italic;
    }
    .user-stats {
      margin-top: 10px;
      display: flex;
      gap: 16px;
    }
    .stat { text-align: center; }
    .stat-num {
      font-family: var(--font-pixel);
      font-size: 18px;
      color: var(--amber-hi);
    }
    .stat-label { font-size: 11px; color: var(--ink-dim); margin-top: 2px; }

    /* ---- 展示柜标题 ---- */
    .cabinet-head {
      margin: 24px 16px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .cabinet-title {
      font-family: var(--font-pixel);
      font-size: 14px;
      color: var(--ink-dim);
      letter-spacing: .08em;
    }
    .cabinet-line {
      flex: 1;
      height: 1px;
      background: var(--line-soft);
    }

    /* ---- 模组行 ---- */
    .module-section { margin: 0 16px 24px; }
    .module-label {
      font-family: var(--font-pixel);
      font-size: 13px;
      font-weight: 600;
      color: #d9beff;
      letter-spacing: .1em;
      margin-bottom: 8px;
      /* 小字号收紧光晕，避免发虚 */
      text-shadow: 0 0 1px #fff, 0 0 5px var(--glow-amber-55);
    }

    /* ---- 档案卡片（横向滚动行） ---- */
    .card-row {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
    }
    .card-row::-webkit-scrollbar { display: none; }

    .record-card {
      flex-shrink: 0;
      width: 200px;
      background: var(--bar-bg-raise);
      border: 1px solid var(--line-neon);
      border-radius: var(--radius-card);
      overflow: hidden;
      position: relative;
    }
    .record-card-portrait {
      width: 100%;
      height: 130px;
      object-fit: cover;
      display: block;
      background: var(--bar-bg-deep);
    }
    .record-card-portrait-placeholder {
      width: 100%;
      height: 130px;
      background: linear-gradient(135deg, var(--bar-bg-deep), var(--bar-bg-wall));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }
    .record-card-body { padding: 10px 12px 12px; }
    .record-archetype {
      font-family: var(--font-pixel);
      font-size: 13px;
      color: var(--neon-pink-hot);
      text-shadow: var(--neon-text-pink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .record-title {
      font-size: 11px;
      color: var(--ink-mid);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .record-tags {
      margin-top: 6px;
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }
    .tag {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--line-neon);
      color: var(--ink-mid);
      white-space: nowrap;
    }
    .tag-mbti {
      border-color: var(--brass);
      color: var(--amber-hi);
    }
    .record-summary {
      margin-top: 8px;
      font-size: 11px;
      color: var(--ink-dim);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .record-score {
      margin-top: 8px;
      font-family: var(--font-pixel);
      font-size: 12px;
      color: var(--neon-amber);
    }
    .record-date {
      position: absolute;
      top: 6px;
      right: 8px;
      font-size: 10px;
      color: var(--ink-ghost);
      background: rgba(20,12,14,.72);
      padding: 2px 5px;
      border-radius: 4px;
    }

    /* ---- R5：同桌爆灯率 ---- */
    .record-burst {
      margin-top: 8px;
      font-family: var(--font-pixel);
      font-size: 11px;
      color: var(--neon-pink-hot);
      text-shadow: var(--neon-text-pink);
      letter-spacing: .02em;
    }

    /* ---- R5：点赞 + 评论（极简） ---- */
    .record-social {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--line-soft);
    }
    .like-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid var(--line-neon);
      border-radius: var(--radius-pill);
      background: var(--bar-bg-raise);
      color: var(--ink-hi);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
    }
    .like-btn:hover { border-color: var(--neon-pink-hot); }
    .like-btn.liked {
      opacity: .6;
      cursor: default;
      color: var(--neon-pink-hot);
      border-color: var(--neon-pink-hot);
    }
    .like-count { font-family: var(--font-pixel); }

    .comment-list {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .comment-item {
      font-size: 11px;
      line-height: 1.5;
      color: var(--ink-mid);
      word-break: break-word;
    }
    .comment-item .cm-name { color: var(--amber-hi); }
    .comment-empty { font-size: 11px; color: var(--ink-ghost); margin-top: 8px; }

    .comment-form {
      margin-top: 8px;
      display: flex;
      gap: 6px;
    }
    .comment-input {
      flex: 1;
      min-width: 0;
      min-height: 44px;
      padding: 10px;
      background: var(--bar-bg-deep);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-btn);
      color: var(--ink-hi);
      font-size: 13px;
      font-family: inherit;
    }
    .comment-input:focus { outline: none; border-color: var(--brass); }
    .comment-send {
      flex-shrink: 0;
      min-width: 44px;
      min-height: 44px;
      padding: 0 12px;
      border: none;
      border-radius: var(--radius-btn);
      background: var(--brass);
      color: #fff;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
    }
    .comment-send:hover { opacity: .9; }
    .comment-send:disabled { opacity: .5; cursor: default; }

    /* ---- 可见性小眼睛（仅本人可见） ---- */
    .record-eye {
      position: absolute;
      top: 4px;
      left: 6px;
      z-index: 2;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      background: rgba(18,10,28,.72);
      color: var(--ink-mid);
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .record-eye:hover { color: var(--amber-hi); }
    .record-card.is-hidden { opacity: .45; }
    .record-card.is-hidden .record-eye { opacity: 1; color: var(--ink-dim); }

    /* ---- toast ---- */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 32px;
      transform: translateX(-50%);
      background: var(--panel, rgba(18,10,28,.92));
      border: 1px solid var(--line-neon);
      color: var(--ink-hi);
      font-size: 13px;
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      z-index: 99;
      opacity: 0;
      transition: opacity .25s;
      pointer-events: none;
      max-width: 80vw;
    }
    .toast.show { opacity: 1; }

    /* ---- 图鉴占位入口 ---- */
    .dex-entry {
      margin: 8px 16px 24px;
      padding: 18px 20px;
      border: 1px dashed var(--line-neon);
      border-radius: var(--radius-card);
      background: var(--bar-bg-raise);
      display: flex;
      align-items: center;
      gap: 14px;
      opacity: .75;
      cursor: not-allowed;
      user-select: none;
    }
    .dex-lock { font-size: 24px; flex-shrink: 0; filter: grayscale(.4); }
    .dex-name {
      font-family: var(--font-pixel);
      font-size: 14px;
      color: var(--ink-mid);
      letter-spacing: .08em;
    }
    .dex-sub { margin-top: 4px; font-size: 12px; color: var(--ink-dim); }

    /* ---- desktop：卡片行改多列网格 ---- */
    @media (min-width: 900px) {
      .user-card, .cabinet-head, .module-section, .action-bar, .dex-entry {
        max-width: 1200px;
        margin-left: auto;
        margin-right: auto;
      }
      .user-card { margin-top: 32px; }
      .card-row {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        overflow-x: visible;
      }
      .record-card { width: auto; }
      .record-card-portrait, .record-card-portrait-placeholder { height: 160px; }
    }

    /* ---- 空状态 ---- */
    .empty {
      text-align: center;
      padding: 48px 24px;
      color: var(--ink-dim);
      font-size: 14px;
    }
    .empty-icon { font-size: 40px; display: block; margin-bottom: 12px; }

    /* ---- 404/错误 ---- */
    .error-wrap {
      text-align: center;
      padding: 60px 24px;
    }
    .error-icon { font-size: 48px; display: block; margin-bottom: 16px; }
    .error-msg {
      font-family: var(--font-pixel);
      font-size: 16px;
      color: var(--neon-pink-hot);
    }
    .error-sub { margin-top: 8px; color: var(--ink-dim); font-size: 13px; }
    .error-raw { margin-top: 14px; color: var(--ink-ghost); font-size: 11px; }

    /* ---- 想看的方向 徽标 ---- */
    .seek-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding: 3px 11px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--line-neon);
      background: var(--bar-bg-raise);
      font-size: 11px;
      color: var(--amber-hi);
      font-family: var(--font-pixel);
      letter-spacing: .04em;
    }
    .seek-badge .seek-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--amber-hi);
      box-shadow: 0 0 5px var(--brass);
      flex-shrink: 0;
    }

    /* ---- 找回身份 / 选择屏 ---- */
    .auth-wrap {
      max-width: 460px;
      margin: 40px auto 0;
      padding: 0 20px 60px;
    }
    .auth-hero { text-align: center; margin-bottom: 8px; }
    .auth-hero-ico { font-size: 44px; display: block; margin-bottom: 14px; }
    .auth-title {
      font-family: var(--font-pixel);
      font-size: 20px;
      color: var(--ink-hi);
    }
    .auth-sub {
      margin-top: 10px;
      color: var(--ink-dim);
      font-size: 13px;
      line-height: 1.6;
    }
    .auth-choices {
      margin-top: 26px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .auth-card {
      text-align: left;
      padding: 16px 18px;
      border-radius: var(--radius-card);
      border: 1px solid var(--line-soft);
      background: var(--panel);
      cursor: pointer;
      color: inherit;
      text-decoration: none;
      display: block;
      width: 100%;
      font-family: inherit;
    }
    .auth-card:hover { border-color: var(--line-neon); }
    .auth-card-title {
      font-family: var(--font-pixel);
      font-size: 15px;
      color: var(--ink-hi);
    }
    .auth-card-sub {
      margin-top: 5px;
      font-size: 12px;
      color: var(--ink-dim);
      line-height: 1.5;
    }

    /* ---- 找回表单 ---- */
    .recover-form { margin-top: 24px; display: none; }
    .recover-form.show { display: block; }
    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 12px;
      color: var(--ink-mid);
      margin-bottom: 6px;
      font-family: var(--font-pixel);
      letter-spacing: .04em;
    }
    .field input {
      width: 100%;
      padding: 13px 14px;
      background: var(--bar-bg-raise);
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-btn);
      color: var(--ink-hi);
      font-size: 15px;
      font-family: inherit;
    }
    .field input:focus {
      outline: none;
      border-color: var(--brass);
      box-shadow: 0 0 0 2px var(--glow-amber-55);
    }
    .recover-err {
      min-height: 18px;
      margin: -2px 0 12px;
      font-size: 12px;
      color: var(--neon-pink-hot);
      line-height: 1.5;
    }
    .btn-recover {
      width: 100%;
      padding: 14px;
      background: var(--neon-pink);
      color: #fff;
      border: none;
      border-radius: var(--radius-btn);
      font-family: var(--font-pixel);
      font-size: 15px;
      cursor: pointer;
      box-shadow: var(--neon-box-pink);
    }
    .btn-recover:hover { opacity: .92; }
    .btn-recover:disabled { opacity: .5; cursor: default; }
    .recover-back {
      display: block;
      text-align: center;
      margin-top: 16px;
      color: var(--amber-hi);
      font-size: 13px;
      background: none;
      border: none;
      cursor: pointer;
      width: 100%;
      font-family: inherit;
    }
    .recover-back:hover { text-shadow: var(--neon-text-cyan); }

    /* ---- 进大厅按钮（自己看自己档案时才显示） ---- */
    .action-bar {
      padding: 16px;
      display: flex;
      gap: 10px;
    }
    .btn-lobby {
      flex: 1;
      padding: 14px;
      background: var(--neon-pink);
      color: #fff;
      border: none;
      border-radius: var(--radius-btn);
      font-family: var(--font-pixel);
      font-size: 15px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: block;
      box-shadow: var(--neon-box-pink);
    }
    .btn-lobby:hover { opacity: .9; }

    /* ---- 加载骨架 ---- */
    .loading {
      text-align: center;
      padding: 80px 24px;
      font-family: var(--font-pixel);
      color: var(--ink-dim);
      font-size: 14px;
    }
    @keyframes blink { 50% { opacity: .3 } }
    .loading { animation: blink 1.4s ease-in-out infinite; }
  </style>
</head>
<body>

  <nav class="nav">
    <span class="nav-logo-text" aria-label="理想型·加载中">理想型·加载中</span>
    <a class="nav-back" href="/v2/lobby.html">← 回大厅</a>
  </nav>

  <div id="main"><div class="loading">稍等，我去里屋把档案翻出来。</div></div>

  <script type="module">
    /* ---- R11「重新调一杯」：清本机调酒/账号缓存 → 回调酒页走生面孔流 ----
       key 列表与 app.js RESET_COCKTAIL_KEYS 保持一致（两处入口清一样的东西）：
       ideal_cocktail / ideal_userId / ideal_token / ideal_gender / ideal_seeking /
       mfn_seeking / mfn_name / mfn_emoji / mfn_drink / mfn_deck /
       mfn_aha_saved / mfn_codex_saved / statsKey + 前缀 mfn_token_* + 前缀 liked:*。
       不动 mfn_sound（音量偏好，跟身份无关）。
       R12：liked:* 改为一起清 —— 不清的话「生面孔」重走一遍，别人展示柜上的卡还是
       灰的点不了赞，提示就成了假话（app.js clearCocktailIdentity 同步改过）。 */
    const RESET_COCKTAIL_KEYS = [
      "ideal_cocktail", "ideal_userId", "ideal_token", "ideal_gender", "ideal_seeking",
      "mfn_seeking", "mfn_name", "mfn_emoji", "mfn_drink", "mfn_deck",
      "mfn_aha_saved", "mfn_codex_saved", "statsKey",
    ];
    function clearCocktailIdentity() {
      try {
        for (const k of RESET_COCKTAIL_KEYS) localStorage.removeItem(k);
        const doomed = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && (k.startsWith("mfn_token_") || k.startsWith("liked:"))) doomed.push(k);
        }
        doomed.forEach(k => localStorage.removeItem(k));
      } catch (e) { /* 隐私模式清不了也别拦跳转 */ }
    }
    function resetCocktailIdentity() {
      clearCocktailIdentity();
      location.href = "/v2/cocktail.html";
    }

    /* R12 ?fresh=1 强制清档：Kim 的微信里存着旧档案，要一条「打开就是全新体验」的链接。
       进页即清（同一份 key 清单）→ 抹掉参数（replaceState，不跳转不刷新）→ 原地继续。
       必须跑在下面读 ideal_userId / ideal_token 之前。 */
    (function applyFreshParam() {
      try {
        const q = new URLSearchParams(location.search);
        if (q.get("fresh") !== "1") return;
        clearCocktailIdentity();
        q.delete("fresh");
        const qs = q.toString();
        history.replaceState(null, "", location.pathname + (qs ? "?" + qs : "") + location.hash);
      } catch (e) { /* 参数处理失败绝不能挡住进页 */ }
    })();

    /* ---- 工具 ---- */
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
      );
    }

    // R5：评论列表渲染（昵称+内容，全部走 esc 防 XSS；空态给一句引导）
    function renderComments(list) {
      if (!list || !list.length) return `<div class="comment-empty">还没人留话，来一句？</div>`;
      return list.map(c =>
        `<div class="comment-item"><span class="cm-name">${esc(c.name || "路人")}</span>：${esc(c.text || "")}</div>`
      ).join("");
    }

    const MODULE_NAMES = {
      lover: "满分爱人",
      boss: "满分老板",
      agent: "满分 Agent",
      roommate: "满分室友",
      teacher: "满分老师",
    };

    // 想看的方向（seeking：m|f|x）→ COPY-PACK 三选文案；别把 m/f/x 原文露给用户
    const SEEK_LABEL = { m: "满分男", f: "满分女", x: "都行" };

    function fmtDate(ts) {
      if (!ts) return "";
      const d = new Date(ts);
      return `${d.getMonth() + 1}/${d.getDate()}`;
    }

    /* ---- toast ---- */
    let toastTimer = null;
    function toast(msg) {
      let $t = document.querySelector(".toast");
      if (!$t) {
        $t = document.createElement("div");
        $t.className = "toast";
        document.body.appendChild($t);
      }
      $t.textContent = msg;
      $t.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => $t.classList.remove("show"), 2200);
    }

    /* ---- 迷你杯型 SVG（对应 cocktail.glass：martini/highball/rocks/coupe） ---- */
    function glassIcon(type) {
      const L = "#bfe8ff", A = "#c86bff", B = "#2de2ff";
      const svgs = {
        martini: `<polygon points="8,10 44,10 26,28" fill="${A}" opacity=".85"/>
          <polygon points="8,10 44,10 26,28" fill="none" stroke="${L}" stroke-width="2.5"/>
          <rect x="24.5" y="28" width="3" height="12" fill="${L}"/>
          <rect x="16" y="40" width="20" height="3" rx="1" fill="${L}"/>
          <circle cx="34" cy="8" r="3.5" fill="#ff2d5e"/>`,
        highball: `<rect x="15" y="14" width="22" height="28" fill="${B}" opacity=".7"/>
          <rect x="15" y="10" width="22" height="4" fill="none"/>
          <path d="M 15 8 L 15 42 L 37 42 L 37 8" fill="none" stroke="${L}" stroke-width="2.5"/>
          <rect x="19" y="17" width="6" height="6" rx="1" fill="#cfeaff" opacity=".85"/>
          <rect x="27" y="24" width="6" height="6" rx="1" fill="#cfeaff" opacity=".85"/>`,
        rocks: `<rect x="12" y="22" width="28" height="18" fill="#ffb020" opacity=".75"/>
          <path d="M 12 16 L 12 40 L 40 40 L 40 16" fill="none" stroke="${L}" stroke-width="2.5"/>
          <rect x="10" y="39" width="32" height="3.5" rx="1" fill="${L}"/>
          <rect x="18" y="25" width="7" height="7" rx="1" fill="#cfeaff" opacity=".85"/>`,
        coupe: `<path d="M 9 9 L 43 9 L 41 17 Q 38 24 26 24 Q 14 24 11 17 Z" fill="${A}" opacity=".85"/>
          <path d="M 9 9 L 43 9 L 41 17 Q 38 24 26 24 Q 14 24 11 17 Z" fill="none" stroke="${L}" stroke-width="2.5"/>
          <rect x="24.5" y="24" width="3" height="14" fill="${L}"/>
          <rect x="16" y="38" width="20" height="3" rx="1" fill="${L}"/>`,
      };
      const body = svgs[type] || svgs.martini;
      return `<span class="cocktail-glass-icon" aria-hidden="true"><svg viewBox="0 0 52 52">${body}</svg></span>`;
    }

    /* ---- 读路由 ---- */
    const userId = new URLSearchParams(location.search).get("id");
    const myId    = localStorage.getItem("ideal_userId");
    const isSelf  = userId && userId === myId;

    /* ---- 渲染档案 ---- */
    function renderProfile(data) {
      const $main = document.getElementById("main");

      // 头像：cocktail imageUrl 或 pollinations 生成的小像
      const avatarUrl = data.cocktail?.imageUrl
        || (data.avatarSeed
          ? `https://image.pollinations.ai/prompt/cute+pixel+avatar+${encodeURIComponent(data.avatarSeed)}?width=72&height=72&seed=42&nologo=true&referrer=idealtype`
          : null);

      const avatarHtml = avatarUrl
        ? `<img class="avatar" src="${esc(avatarUrl)}" alt="${esc(data.nick)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" /><div class="avatar-placeholder" style="display:none">🍸</div>`
        : `<div class="avatar-placeholder">🍸</div>`;

      // 展示柜
      const showcase = data.showcase || {};
      const moduleOrder = ["lover", "boss", "agent", "roommate", "teacher"];
      const filledModules = moduleOrder.filter(m => showcase[m]?.length);

      // 给每条记录标一个全局 idx（后端 records 数组下标）：
      // 后端按 push 顺序分组进 showcase，各模组内顺序即原始顺序；
      // 若后端已返回 rec.idx 则优先用，否则按 ts 升序重建。
      const allRecs = moduleOrder.flatMap(m => showcase[m] || []);
      allRecs.sort((a, b) => (a.ts || 0) - (b.ts || 0));
      allRecs.forEach((rec, i) => { if (rec.idx == null) rec.idx = i; });

      const showcaseHtml = filledModules.length === 0
        ? `<div class="empty"><span class="empty-icon">🫙</span>柜子还空着。今晚的故事，得你自己喝出来。</div>`
        : filledModules.map(mod => {
            const records = [...showcase[mod]].reverse(); // 最新的在前
            const cardsHtml = records.map(rec => {
              const p = rec.profile || {};
              const portrait = p.imageUrl
                ? `<img class="record-card-portrait" src="${esc(p.imageUrl)}" alt="${esc(p.archetype)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" /><div class="record-card-portrait-placeholder" style="display:none">✨</div>`
                : `<div class="record-card-portrait-placeholder">✨</div>`;
              const tags = [
                p.mbti ? `<span class="tag tag-mbti">${esc(p.mbti)}</span>` : "",
                p.occupation ? `<span class="tag">${esc(p.occupation)}</span>` : "",
                rec.role === "host" ? `<span class="tag">房主局</span>` : "",
              ].filter(Boolean).join("");
              const score = p.avgScore > 0
                ? `<div class="record-score">场均 ${p.avgScore.toFixed(1)} 分</div>`
                : "";

              // R5 §1.2 同桌爆灯率 = 爆 / (爆+灭)，分母 0 显示「—」（不显示 0%）
              const bt = Number(p.burstTotal) || 0;
              const ot = Number(p.offTotal) || 0;
              const denom = bt + ot;
              const burstHtml = `<div class="record-burst">同桌爆灯率 ${denom > 0 ? Math.round(bt / denom * 100) + "%" : "—"}</div>`;

              // R5 §1.3 点赞 + 评论（每卡稳定 recordId：优先后端 id，兜底 userId:idx）
              const recordId = rec.id || `${userId}:${rec.idx}`;
              const likes = Number(rec.likes) || 0;
              const liked = localStorage.getItem("liked:" + recordId) === "1";
              const comments = Array.isArray(rec.comments)
                ? [...rec.comments].sort((a, b) => (b.ts || 0) - (a.ts || 0)).slice(0, 20)
                : [];
              const socialHtml = `
                <div class="record-social">
                  <button class="like-btn${liked ? " liked" : ""}" type="button" data-record="${esc(recordId)}"${liked ? " disabled" : ""} aria-label="点赞">
                    <span aria-hidden="true">👍</span><span class="like-count">${likes}</span>
                  </button>
                  <div class="comment-list">${renderComments(comments)}</div>
                  <form class="comment-form" data-record="${esc(recordId)}">
                    <input class="comment-input" type="text" maxlength="80" placeholder="留一句…" aria-label="写评论" />
                    <button class="comment-send" type="submit">发送</button>
                  </form>
                </div>`;

              const hidden = !!rec.hidden;
              const eye = isSelf
                ? `<button class="record-eye" type="button" data-idx="${rec.idx}" title="${hidden ? "已隐藏，点击公开" : "公开中，点击隐藏"}" aria-label="切换这条记录的可见性">${hidden ? "🙈" : "👁"}</button>`
                : "";
              return `
                <div class="record-card${hidden ? " is-hidden" : ""}" data-idx="${rec.idx}">
                  ${eye}
                  ${portrait}
                  <span class="record-date">${fmtDate(rec.ts)}</span>
                  <div class="record-card-body">
                    <div class="record-archetype">${esc(p.archetype || "神秘原型")}</div>
                    ${p.title ? `<div class="record-title">${esc(p.title)}</div>` : ""}
                    ${tags ? `<div class="record-tags">${tags}</div>` : ""}
                    ${p.summary ? `<div class="record-summary">${esc(p.summary)}</div>` : ""}
                    ${score}
                    ${burstHtml}
                    ${socialHtml}
                  </div>
                </div>`;
            }).join("");

            return `
              <div class="module-section">
                <div class="module-label">${esc(MODULE_NAMES[mod] || mod)}</div>
                <div class="card-row">${cardsHtml}</div>
              </div>`;
          }).join("");

      // R11：主页也留一个「重新调一杯」小链接（清本地调酒/账号缓存 → 回调酒页走生面孔流）
      const actionBar = isSelf
        ? `<div class="action-bar"><a class="btn-lobby" href="/v2/lobby.html">进大厅再玩一局</a></div>
           <div style="text-align:center;margin:10px 0 4px">
             <button type="button" id="resetCocktailBtn"
               style="background:none;border:0;padding:4px 8px;color:var(--ink-mid,#c9ac90);font-size:13px;text-decoration:underline;cursor:pointer"
               title="清掉本机的调酒与账号缓存，按生面孔重走一遍">重新调一杯</button>
           </div>`
        : "";

      const cocktailHtml = data.cocktail?.name
        ? `<div class="user-cocktail">
            ${glassIcon(data.cocktail.glass)}
            <span class="user-cocktail-text">今晚特调：${esc(data.cocktail.name)}</span>
          </div>`
        : "";

      // 想看的方向徽标：后端返回 seeking（m|f|x）时才显示，用三选文案
      const seekBadge = SEEK_LABEL[data.seeking]
        ? `<div class="seek-badge"><span class="seek-dot"></span>想看 ${esc(SEEK_LABEL[data.seeking])}</div>`
        : "";

      const dexEntry = `
        <div class="dex-entry" role="note" aria-disabled="true">
          <span class="dex-lock">🔒</span>
          <div>
            <div class="dex-name">图鉴</div>
            <div class="dex-sub">这一柜还在酿。等它开封，你收过的每一型都排得上号。</div>
          </div>
        </div>`;

      $main.innerHTML = `
        <div class="user-card">
          ${avatarHtml}
          <div class="user-info">
            <div class="user-nick px-title">${esc(data.nick)}</div>
            ${seekBadge}
            ${cocktailHtml}
            <div class="user-stats">
              <div class="stat">
                <div class="stat-num">${data.playCount ?? 0}</div>
                <div class="stat-label">上桌次数</div>
              </div>
              <div class="stat">
                <div class="stat-num">${filledModules.length}</div>
                <div class="stat-label">解锁模组</div>
              </div>
            </div>
          </div>
        </div>

        <div class="cabinet-head">
          <span class="cabinet-title">理想型展示柜</span>
          <span class="cabinet-line"></span>
        </div>

        ${showcaseHtml}
        ${dexEntry}
        ${actionBar}
      `;

      if (isSelf) bindEyeToggles($main);
      bindLikes($main);
      bindComments($main);
      document.getElementById("resetCocktailBtn")?.addEventListener("click", resetCocktailIdentity);

      document.title = `${data.nick} 的理想型档案`;
    }

    /* ---- R5：点赞（localStorage 去重 + 乐观置灰，后端回真实计数） ---- */
    function bindLikes($root) {
      $root.querySelectorAll(".like-btn").forEach(btn => {
        btn.addEventListener("click", async () => {
          if (btn.classList.contains("liked")) return;
          const recordId = btn.dataset.record;
          const $count = btn.querySelector(".like-count");
          const prev = Number($count.textContent) || 0;
          const setCount = (n) => { $count.textContent = n; };

          // 乐观：置灰 + 本地去重 + 计数 +1
          btn.classList.add("liked");
          btn.disabled = true;
          localStorage.setItem("liked:" + recordId, "1");
          setCount(prev + 1);
          // 任一失败路径都必须走这里：乐观状态全撤，重新可点（否则按钮被永久锁死）
          const rollback = () => {
            btn.classList.remove("liked");
            btn.disabled = false;
            localStorage.removeItem("liked:" + recordId);
            setCount(prev);
          };

          try {
            const res = await fetch("/api/showcase/like", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ recordId }),
            });
            if (res.ok) {
              const data = await res.json().catch(() => null);
              if (data && typeof data.likes === "number") setCount(data.likes);
            } else {
              // R12 审查修复（提示=功能铁律）：原来 404 / 网络异常两条路径都说「先记下了，稍后同步」，
              // 但全站根本没有重试队列 / pending 存储 / 启动 flush——这个赞永远发不出去。
              // 更糟的是乐观写的 liked:<id> 还留着，按钮被永久锁死，用户连重试的机会都没有。
              // 现在统一回滚（含清掉 liked 台账），说实话：没点上，可以再点一次。
              rollback();
              toast("没点上，再试一次");
            }
          } catch {
            rollback();
            toast("没点上，再试一次");
          }
        });
      });
    }

    /* ---- R5：评论（≤80 字，提交后新评论插到列表顶部，esc 渲染防 XSS） ---- */
    function prependComment(list, c) {
      const empty = list.querySelector(".comment-empty");
      if (empty) empty.remove();
      const div = document.createElement("div");
      div.className = "comment-item";
      div.innerHTML = `<span class="cm-name">${esc(c.name || "路人")}</span>：${esc(c.text || "")}`;
      list.insertBefore(div, list.firstChild);
      while (list.querySelectorAll(".comment-item").length > 20) {
        list.removeChild(list.lastChild);
      }
    }

    function bindComments($root) {
      $root.querySelectorAll(".comment-form").forEach(form => {
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const recordId = form.dataset.record;
          const input = form.querySelector(".comment-input");
          const send = form.querySelector(".comment-send");
          const list = form.parentElement.querySelector(".comment-list");
          const text = input.value.trim();
          if (!text) return;
          if (text.length > 80) { toast("最多 80 个字"); return; }

          // 本地昵称兜底：当前身份昵称，无则「路人」（后端返回列表时以后端为准）
          const localName = localStorage.getItem("mfn_name") || "路人";
          send.disabled = true;
          try {
            const res = await fetch("/api/showcase/comment", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ recordId, text }),
            });
            if (res.ok) {
              const data = await res.json().catch(() => null);
              const comments = Array.isArray(data?.comments) ? data.comments
                : Array.isArray(data) ? data : null;
              if (comments) {
                const sorted = [...comments].sort((a, b) => (b.ts || 0) - (a.ts || 0)).slice(0, 20);
                list.innerHTML = renderComments(sorted);
              } else {
                prependComment(list, { name: localName, text });
              }
              input.value = "";
            } else {
              // R12 审查修复：原来 404 / 网络异常会把评论插进 DOM、清空输入框，再说「稍后同步」——
              // 实际上没有任何重试队列，这条评论刷新就没了，用户还以为发出去了。
              // 现在两条失败路径都不动 DOM、不清输入框（内容不丢，能直接再点一次「发」），文案说实话。
              toast("没发出去，再试一次");
            }
          } catch {
            toast("没发出去，再试一次");
          }
          send.disabled = false;
        });
      });
    }

    /* ---- 可见性切换 ---- */
    function bindEyeToggles($root) {
      $root.querySelectorAll(".record-eye").forEach(btn => {
        btn.addEventListener("click", async () => {
          const card = btn.closest(".record-card");
          const idx = btn.dataset.idx;
          const willHide = !card.classList.contains("is-hidden");

          // 先本地切换 UI（不管后端成不成，体验不卡）
          const apply = (hidden) => {
            card.classList.toggle("is-hidden", hidden);
            btn.textContent = hidden ? "🙈" : "👁";
            btn.title = hidden ? "已隐藏，点击公开" : "公开中，点击隐藏";
          };
          apply(willHide);

          const token = localStorage.getItem("ideal_token") || "";
          try {
            const res = await fetch(`/api/user/${userId}/records/${idx}/visibility`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ token, hidden: willHide }),
            });
            if (!res.ok) {
              // R12 审查修复：这条最危险 —— 原来 404 / 网络异常只说「先记下了，稍后同步」，
              // 眼睛图标却已经翻成🙈，用户以为这张卡藏起来了，服务端其实一个字没改，
              // 卡片对所有人依旧是公开的。现在失败一律把图标翻回去，并说清楚没改成。
              apply(!willHide);
              toast("没改成，再点一次试试");
            } else {
              toast(willHide ? "这条收进柜子里层了，只有你看得见" : "这条摆出来了");
            }
          } catch {
            apply(!willHide);
            toast("没改成，再点一次试试");
          }
        });
      });
    }

    /* ---- 错误状态（雪克口吻包一层，服务端原文放小字） ---- */
    function renderError(msg, offerRecover) {
      const recoverBtn = offerRecover
        ? `<div style="margin-top:14px"><button type="button" id="errRecover" class="recover-back" style="margin-top:0">换了设备？对暗号找回 →</button></div>`
        : "";
      document.getElementById("main").innerHTML = `
        <div class="error-wrap">
          <span class="error-icon">🍺</span>
          <div class="error-msg">这份档案我翻不着。</div>
          <div class="error-sub">要么码不对，要么它还没写成。</div>
          <div class="error-raw">${esc(msg)}</div>
          ${recoverBtn}
          <div style="margin-top:24px">
            <a href="/v2/lobby.html" style="color:var(--amber-hi);font-size:14px">← 去大厅开一局</a>
          </div>
        </div>`;
      const $r = document.getElementById("errRecover");
      if ($r) $r.addEventListener("click", renderAuthChoice);
    }

    /* ---- 无身份 / 找回：对暗号 or 第一次来 ---- */
    function renderAuthChoice() {
      const $main = document.getElementById("main");
      $main.innerHTML = `
        <div class="auth-wrap">
          <div class="auth-hero">
            <span class="auth-hero-ico">🍸</span>
            <div class="auth-title">头回来，还是回头客？</div>
            <div class="auth-sub">这台设备我还没认出你。你说一声，我就知道该翻哪本账。</div>
          </div>
          <div class="auth-choices">
            <a class="auth-card" href="/v2/cocktail.html">
              <div class="auth-card-title">第一次来</div>
              <div class="auth-card-sub">先去吧台调杯酒，从头认识一下。</div>
            </a>
            <button class="auth-card" type="button" id="pickRecover">
              <div class="auth-card-title">我来过，对暗号</div>
              <div class="auth-card-sub">报上称呼和暗号，换了设备我照样认得你。</div>
            </button>
          </div>

          <form class="recover-form" id="recoverForm" novalidate>
            <div class="auth-title" style="font-size:16px;margin-bottom:6px">换手机了？</div>
            <div class="auth-sub" style="margin:0 0 18px">报上称呼和暗号。我认人，从来不看设备。</div>
            <div class="field">
              <label for="rcName">怎么称呼你</label>
              <input id="rcName" type="text" maxlength="12" autocomplete="off" placeholder="这儿没人用真名" />
            </div>
            <div class="field">
              <label for="rcPass">你的暗号（4–6 个数字）</label>
              <input id="rcPass" type="text" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="4 到 6 位数字" />
            </div>
            <div class="recover-err" id="rcErr" role="alert"></div>
            <button class="btn-recover" type="submit" id="rcBtn">对暗号</button>
            <button class="recover-back" type="button" id="rcBack">← 再想想，先不对</button>
          </form>
        </div>`;

      const form = document.getElementById("recoverForm");
      document.getElementById("pickRecover").addEventListener("click", () => {
        form.classList.add("show");
        form.scrollIntoView({ behavior: "smooth", block: "nearest" });
        document.getElementById("rcName").focus();
      });
      document.getElementById("rcBack").addEventListener("click", () => {
        form.classList.remove("show");
        document.getElementById("rcErr").textContent = "";
      });
      form.addEventListener("submit", onRecoverSubmit);
      document.title = "对暗号 · 理想型档案";
    }

    async function onRecoverSubmit(e) {
      e.preventDefault();
      const $err = document.getElementById("rcErr");
      const $btn = document.getElementById("rcBtn");
      const name = document.getElementById("rcName").value.trim();
      const passcode = document.getElementById("rcPass").value.trim();
      $err.textContent = "";

      if (!name) { $err.textContent = "先报个称呼，我才好翻账。"; return; }
      if (!/^\d{4,6}$/.test(passcode)) {
        $err.textContent = "暗号是 4 到 6 个数字。再敲一遍。";
        return;
      }

      $btn.disabled = true;
      const label = $btn.textContent;
      $btn.textContent = "对着呢…";
      try {
        const res = await fetch("/api/recover", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, passcode }),
        });
        if (res.ok) {
          const data = await res.json();
          localStorage.setItem("ideal_userId", data.userId);
          localStorage.setItem("ideal_token", data.token);
          localStorage.setItem("mfn_name", name);
          toast("对上了。柜子还是你那个柜子。");
          setTimeout(() => location.replace("/u.html?id=" + data.userId), 800);
          return;
        }
        // 403 口令不对 / 404 没这名字：COPY-PACK 合并为同一句雪克口吻提示
        if (res.status === 403 || res.status === 404) {
          $err.textContent = "暗号对不上。再想想——实在想不起来，就回吧台重调一杯。";
        } else {
          $err.textContent = "线路的事，不赖你。歇一下再对一遍。";
        }
      } catch {
        $err.textContent = "线路的事，不赖你。歇一下再对一遍。";
      }
      $btn.disabled = false;
      $btn.textContent = label;
    }

    /* ---- 入口 ---- */
    if (!userId) {
      if (myId) {
        // 有本地身份 → 直接看自己的档案
        location.replace("/u.html?id=" + myId);
      } else {
        // 无本地身份 → 对暗号找回 or 第一次来
        renderAuthChoice();
      }
    } else {
      // 本人视角带 token：后端会返回含隐藏记录的完整展示柜（每条带 hidden/idx）
      const tokenQS = isSelf && localStorage.getItem("ideal_token")
        ? `?token=${encodeURIComponent(localStorage.getItem("ideal_token"))}`
        : "";
      fetch(`/api/user/${userId}${tokenQS}`)
        .then(r => r.json())
        .then(data => {
          // 档案翻不着：本人（身份可能失效）或匿名访客，给对暗号找回入口
          if (data.error) renderError(data.error, isSelf || !myId);
          else renderProfile(data);
        })
        .catch(() => renderError("网络错误，稍后再试", isSelf || !myId));
    }
  </script>

</body>
</html>
